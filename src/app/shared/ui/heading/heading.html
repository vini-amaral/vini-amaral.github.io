<ng-template #projected>
  <ng-content />
</ng-template>

@switch (level()) {
  @case (1) {
    <h1 [class]="visualClass()"><ng-container *ngTemplateOutlet="projected" /></h1>
  }
  @case (2) {
    <h2 [class]="visualClass()"><ng-container *ngTemplateOutlet="projected" /></h2>
  }
  @case (3) {
    <h3 [class]="visualClass()"><ng-container *ngTemplateOutlet="projected" /></h3>
  }
  @case (4) {
    <h4 [class]="visualClass()"><ng-container *ngTemplateOutlet="projected" /></h4>
  }
  @case (5) {
    <h5 [class]="visualClass()"><ng-container *ngTemplateOutlet="projected" /></h5>
  }
  @default {
    <h6 [class]="visualClass()"><ng-container *ngTemplateOutlet="projected" /></h6>
  }
}
