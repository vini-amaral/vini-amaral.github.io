<ng-template #projected>
  <ng-content />
</ng-template>

@if (routerLink()) {
  <a
    [routerLink]="routerLink()"
    class="button"
    [class.button--secondary]="variant() === 'secondary'"
  >
    <ng-container *ngTemplateOutlet="projected" />
  </a>
} @else if (href()) {
  <a
    [href]="href()"
    [target]="target()"
    [attr.rel]="rel()"
    class="button"
    [class.button--secondary]="variant() === 'secondary'"
  >
    <ng-container *ngTemplateOutlet="projected" />
  </a>
} @else {
  <button [type]="type()" class="button" [class.button--secondary]="variant() === 'secondary'">
    <ng-container *ngTemplateOutlet="projected" />
  </button>
}
