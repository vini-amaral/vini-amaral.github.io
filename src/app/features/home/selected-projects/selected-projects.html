<app-section>
  <app-container>
    <app-heading [level]="2" visual="h2">Projetos selecionados</app-heading>

    @if (selectedProjects().length > 0) {
      <ul class="selected-projects-list">
        @for (project of selectedProjects(); track project.id) {
          <li>
            <app-project-summary [project]="project" [titleLevel]="3" />
          </li>
        }
      </ul>
    }
  </app-container>
</app-section>
