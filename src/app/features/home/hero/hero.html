<app-section>
  <app-container>
    <div class="hero-layout">
      <div class="hero-copy">
        <app-heading [level]="1" visual="display">{{ name() }}</app-heading>
        <p class="hero-title">{{ title }}</p>
        <p class="hero-summary">{{ summary() }}</p>
        <app-button routerLink="/projects">Ver projetos</app-button>
      </div>

      <div class="hero-portrait" aria-hidden="true">PROFILE_IMAGE_PLACEHOLDER</div>
    </div>
  </app-container>
</app-section>
