<app-section surface="raised">
  <app-container>
    <app-heading [level]="2" visual="h2">Sobre</app-heading>

    @if (intro()) {
      <p class="about-intro">{{ intro() }}</p>
    }

    @if (teaserParagraph()) {
      <p class="about-teaser-text">{{ teaserParagraph() }}</p>
    }

    <app-button variant="secondary" routerLink="/about">Saiba mais sobre mim</app-button>
  </app-container>
</app-section>
