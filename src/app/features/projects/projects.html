<app-section>
  <app-container>
    <app-heading [level]="1" visual="display">Projetos</app-heading>

    @if (projects().length > 0) {
      <ul class="projects-list">
        @for (project of projects(); track project.id) {
          <li>
            <app-project-summary [project]="project" />
          </li>
        }
      </ul>
    }
  </app-container>
</app-section>
